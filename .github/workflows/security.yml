# Security CI gates for task #13 / traceability finding SUPPLY-01.
#
# PR gates (always on, no secrets required):
#   - dependency-review : GitHub dependency review, fails on high+ severity.
#                         The dependency graph must be enabled in the repo
#                         settings (Settings → Code security and analysis);
#                         until then the job detects unavailability through
#                         the compare API and skips with a notice, matching
#                         the key-optional dependency-check philosophy.
#   - sast-sbom         : FindSecBugs (security profile) + CycloneDX SBOM
#   - trivy-fs          : OSV-based vulnerability + secret scan (PR vuln gate)
#   - trivy-config      : IaC misconfiguration scan (chart, compose, Dockerfiles)
#
# The Trivy jobs are two-phase by necessity: with `format: sarif`,
# trivy-action v0.36.0 overrides the severity filter to ALL severities (so
# code scanning sees everything), which would make `exit-code: 1` fail on
# LOW advisories such as Dockerfile DS-0026 (no HEALTHCHECK). Each job
# therefore runs a table-format GATE step at HIGH/CRITICAL with exit-code 1,
# followed by a non-failing SARIF export (`limit-severities-for-sarif: true`)
# for code scanning.
#
# Scheduled / dispatch only (cron fires on the default branch):
#   - dependency-check  : OWASP Dependency-Check when NVD_API_KEY is present;
#                         skips with a notice otherwise (key-optional decision).
name: Security

on:
  pull_request:
  schedule:
    - cron: '40 18 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Check dependency graph availability
        id: graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # dependency-review-action requires the dependency graph, which on
          # private repos must be enabled in the repo settings. Probe the same
          # compare API the action uses; on any non-200 skip with a notice
          # instead of failing the PR gate on a settings toggle.
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          code="$(curl -s -o /tmp/depgraph.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/dependency-graph/compare/${base}...${head}")"
          if [ "${code}" = "200" ]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::Dependency graph is not available for this repository (HTTP ${code}); skipping dependency review. Enable the dependency graph under Settings → Code security and analysis to activate this gate."
            echo "available=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Dependency review
        if: steps.graph.outputs.available == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

  sast-sbom:
    name: FindSecBugs + SBOM
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Verify with security profile (FindSecBugs + SBOM)
        run: ./mvnw -B -ntp -Pprod,security -DskipTests -Ddependency-check.skip=true verify
      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-cyclonedx
          path: |
            target/bom.json
            target/bom.xml
          retention-days: 30
          if-no-files-found: error
      - name: Upload SpotBugs reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spotbugs-reports
          path: '**/target/spotbugsXml.xml'
          retention-days: 14
          if-no-files-found: ignore

  trivy-fs:
    name: Trivy filesystem (vuln + secret)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up JDK 25 (warm Maven cache for pom resolution)
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Trivy filesystem gate (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: 'false'
          format: table
      - name: Trivy filesystem SARIF (code scanning, non-gating)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: 'false'
          format: sarif
          output: trivy-fs-results.sarif
          limit-severities-for-sarif: true
      - name: Upload Trivy filesystem SARIF
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@411bbbe57033eedfc1a82d68c01345aa96c737d7 # v4
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-fs

  trivy-config:
    name: Trivy config (${{ matrix.path }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        path:
          - deploy
          - admin-server
          - api-gateway
          - appointment-service
          - audit-service
          - auth-service
          - clinic-service
          - clinical-records-service
          - config-server
          - discovery-server
          - genai-service
          - notification-service
          - system-service
          - user-profile-service
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Trivy config gate (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ matrix.path }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table
      - name: Trivy config SARIF (code scanning, non-gating)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ matrix.path }}
          severity: HIGH,CRITICAL
          exit-code: '0'
          format: sarif
          output: trivy-config-results.sarif
          limit-severities-for-sarif: true
      - name: Upload Trivy config SARIF
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@411bbbe57033eedfc1a82d68c01345aa96c737d7 # v4
        with:
          sarif_file: trivy-config-results.sarif
          category: trivy-config-${{ matrix.path }}

  dependency-check:
    name: OWASP Dependency-Check (scheduled)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Check NVD API key
        id: gate
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "${NVD_API_KEY}" ]; then
            echo "::notice::NVD_API_KEY is not configured; skipping OWASP Dependency-Check. Trivy filesystem is the always-on vulnerability gate."
            echo "run=false" >> "${GITHUB_OUTPUT}"
          else
            echo "run=true" >> "${GITHUB_OUTPUT}"
          fi
      - name: Set up JDK 25
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Run OWASP Dependency-Check
        if: steps.gate.outputs.run == 'true'
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw -B -ntp -Pprod,security -DskipTests verify
      - name: Upload Dependency-Check report
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.*
          retention-days: 30
          if-no-files-found: ignore
