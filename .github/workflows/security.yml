# Security CI gates for task #13 / traceability finding SUPPLY-01.
#
# PR gates (always on, no secrets required):
#   - dependency-review : GitHub dependency review, fails on high+ severity
#   - sast-sbom         : FindSecBugs (security profile) + CycloneDX SBOM
#   - trivy-fs          : OSV-based vulnerability + secret scan (PR vuln gate)
#   - trivy-config      : IaC misconfiguration scan (chart, compose, Dockerfiles)
#
# Scheduled / dispatch only (cron fires on the default branch):
#   - dependency-check  : OWASP Dependency-Check when NVD_API_KEY is present;
#                         skips with a notice otherwise (key-optional decision).
name: Security

on:
  pull_request:
  schedule:
    - cron: '40 18 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

  sast-sbom:
    name: FindSecBugs + SBOM
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up JDK 25
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Verify with security profile (FindSecBugs + SBOM)
        run: ./mvnw -B -ntp -Pprod,security -DskipTests -Ddependency-check.skip=true verify
      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-cyclonedx
          path: |
            target/bom.json
            target/bom.xml
          retention-days: 30
          if-no-files-found: error
      - name: Upload SpotBugs reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spotbugs-reports
          path: '**/target/spotbugsXml.xml'
          retention-days: 14
          if-no-files-found: ignore

  trivy-fs:
    name: Trivy filesystem (vuln + secret)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: 'false'
          format: sarif
          output: trivy-fs-results.sarif
      - name: Upload Trivy filesystem SARIF
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@411bbbe57033eedfc1a82d68c01345aa96c737d7 # v4
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-fs

  trivy-config:
    name: Trivy config (${{ matrix.path }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        path:
          - deploy
          - admin-server
          - api-gateway
          - appointment-service
          - audit-service
          - auth-service
          - clinic-service
          - clinical-records-service
          - config-server
          - discovery-server
          - genai-service
          - notification-service
          - system-service
          - user-profile-service
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ matrix.path }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: sarif
          output: trivy-config-results.sarif
      - name: Upload Trivy config SARIF
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@411bbbe57033eedfc1a82d68c01345aa96c737d7 # v4
        with:
          sarif_file: trivy-config-results.sarif
          category: trivy-config-${{ matrix.path }}

  dependency-check:
    name: OWASP Dependency-Check (scheduled)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Check NVD API key
        id: gate
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "${NVD_API_KEY}" ]; then
            echo "::notice::NVD_API_KEY is not configured; skipping OWASP Dependency-Check. Trivy filesystem is the always-on vulnerability gate."
            echo "run=false" >> "${GITHUB_OUTPUT}"
          else
            echo "run=true" >> "${GITHUB_OUTPUT}"
          fi
      - name: Set up JDK 25
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Run OWASP Dependency-Check
        if: steps.gate.outputs.run == 'true'
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw -B -ntp -Pprod,security -DskipTests verify
      - name: Upload Dependency-Check report
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.*
          retention-days: 30
          if-no-files-found: ignore
