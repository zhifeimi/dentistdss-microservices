name: Publish and deploy backend

# Push to main: test, build, publish and cosign-sign (keyless) every service
# image, and mirror + sign the database images. The production cluster's
# Kyverno policy admits only ghcr.io/zhifeimi images signed by a workflow on
# main, pinned by digest. workflow_dispatch on main promotes an existing
# sha-<40 hex> tag to the gitops-prod branch with every digest resolved.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      backend_tag:
        description: Existing immutable sha-<40 hex characters> image tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: homelab-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.backend_tag || format('sha-{0}', github.sha) }}
  COSIGN_RELEASE: v2.6.5
  SERVICES: >-
    config-server discovery-server api-gateway auth-service clinic-service
    appointment-service clinical-records-service admin-server
    notification-service genai-service user-profile-service system-service
    audit-service
  DATABASES: postgres mongo redis

jobs:
  package:
    if: github.event_name == 'push'
    name: Package backend
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Java 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build and test
        run: ./mvnw --batch-mode --no-transfer-progress package -Pprod

      - name: Upload service JARs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-jars-${{ github.sha }}
          path: |
            */target/*.jar
            !*/target/original-*.jar
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.event_name == 'push'
    name: Publish ${{ matrix.service }}
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        service:
          - config-server
          - discovery-server
          - api-gateway
          - auth-service
          - clinic-service
          - appointment-service
          - clinical-records-service
          - admin-server
          - notification-service
          - genai-service
          - user-profile-service
          - system-service
          - audit-service
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Download packaged JARs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-jars-${{ github.sha }}
          path: .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: ${{ env.COSIGN_RELEASE }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish multi-architecture image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/dentistdss-${{ matrix.service }}:${{ env.BACKEND_TAG }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/dentistdss-${{ matrix.service }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.BACKEND_TAG }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Sign image by digest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/dentistdss-${{ matrix.service }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}"

  mirror-databases:
    if: github.event_name == 'push'
    name: Mirror and sign ${{ matrix.database }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        database:
          - postgres
          - mongo
          - redis
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: ${{ env.COSIGN_RELEASE }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror the chart's pinned tag and sign it
        env:
          DATABASE: ${{ matrix.database }}
        run: |
          set -o errexit -o nounset -o pipefail
          tag="$(yq ".databaseImageTags.${DATABASE}" deploy/chart/values.yaml)"
          target="${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/dentistdss-${DATABASE}:${tag}"
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag "${target}" "docker.io/library/${DATABASE}:${tag}"
          digest="$(docker buildx imagetools inspect "${target}" --format '{{json .Manifest}}' | jq --exit-status --raw-output '.digest')"
          cosign sign --yes "${target%:*}@${digest}"

  publish-visibility:
    name: Verify public package access
    needs:
      - publish
      - mirror-databases
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Verify anonymous manifest access
        run: |
          set -o errexit -o nounset -o pipefail
          accept_types="application/vnd.oci.image.index.v1+json"
          accept_types+=",application/vnd.oci.image.manifest.v1+json"
          accept_types+=",application/vnd.docker.distribution.manifest.list.v2+json"
          accept_types+=",application/vnd.docker.distribution.manifest.v2+json"
          refs=()
          for service in ${SERVICES}; do refs+=("dentistdss-${service}:${BACKEND_TAG}"); done
          for database in ${DATABASES}; do
            refs+=("dentistdss-${database}:$(yq ".databaseImageTags.${database}" deploy/chart/values.yaml)")
          done
          for ref in "${refs[@]}"; do
            repository="${GITHUB_REPOSITORY_OWNER}/${ref%%:*}"
            token="$(
              curl --fail --silent --show-error \
                "https://ghcr.io/token?scope=repository:${repository}:pull" |
                jq --exit-status --raw-output '.token'
            )"
            curl --fail --silent --show-error \
              --header "Authorization: Bearer ${token}" \
              --header "Accept: ${accept_types}" \
              "https://ghcr.io/v2/${repository}/manifests/${ref#*:}" \
              >/dev/null || { echo "::error::${ref} is not publicly pullable; set the package to public"; exit 1; }
          done

  image-scan:
    name: Scan ${{ matrix.service }} image
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        service:
          - config-server
          - discovery-server
          - api-gateway
          - auth-service
          - clinic-service
          - appointment-service
          - clinical-records-service
          - admin-server
          - notification-service
          - genai-service
          - user-profile-service
          - system-service
          - audit-service
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/dentistdss-${{ matrix.service }}:${{ env.BACKEND_TAG }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table

  promote-production:
    name: Promote images to production GitOps
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: homelab-production
    permissions:
      contents: write
      packages: read
    steps:
      - name: Check out protected main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - name: Require an immutable SHA tag
        run: |
          if [[ ! "${BACKEND_TAG}" =~ ^sha-[0-9a-f]{40}$ ]]; then
            echo "::error::backend_tag must match sha-<40 lowercase hex characters>"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: ${{ env.COSIGN_RELEASE }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve and verify every image digest
        run: |
          set -o errexit -o nounset -o pipefail
          values=deploy/chart/values-prod.yaml
          pin() { # <image name> <tag>
            local ref="${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/dentistdss-$1"
            local digest
            digest="$(docker buildx imagetools inspect "${ref}:$2" --format '{{json .Manifest}}' | jq --exit-status --raw-output '.digest')"
            # Same identity the production Kyverno policy enforces.
            cosign verify "${ref}@${digest}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp "^https://github.com/zhifeimi/.+/\.github/workflows/.+@refs/heads/main$" \
              >/dev/null
            yq -i ".global.imageDigests[\"$1\"] = \"${digest}\"" "${values}"
          }
          yq -i ".global.imageTag = \"${BACKEND_TAG}\"" "${values}"
          for service in ${SERVICES}; do pin "${service}" "${BACKEND_TAG}"; done
          for database in ${DATABASES}; do
            pin "${database}" "$(yq ".databaseImageTags.${database}" deploy/chart/values.yaml)"
          done

      - name: Create immutable production GitOps revision
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add deploy/chart/values-prod.yaml
          git commit -m "deploy: promote ${BACKEND_TAG} to production [skip ci]"
          git push --force origin HEAD:refs/heads/gitops-prod
