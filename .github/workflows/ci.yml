name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Maven verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: dentistdss
          POSTGRES_USER: dentistdss
          POSTGRES_PASSWORD: dentistdss
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongo:
        image: mongo:8.0
        env:
          MONGO_INITDB_ROOT_USERNAME: dentistdss
          MONGO_INITDB_ROOT_PASSWORD: dentistdss
        ports:
          - 27017:27017
        options: >-
          --health-cmd "echo 'db.runCommand({ping: 1}).ok' | mongosh -u dentistdss -p dentistdss --authenticationDatabase admin --quiet | grep 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/dentistdss
      TEST_DATABASE_USERNAME: dentistdss
      TEST_DATABASE_PASSWORD: dentistdss
      # DATA-02 mongo credential contract: the provision step below applies
      # the real operator script; the Java suite then connects with these
      # test-only passwords to assert collection-level isolation.
      TEST_MONGO_ADMIN_URI: mongodb://dentistdss:dentistdss@localhost:27017/admin
      AUDIT_SERVICE_MONGO_PASSWORD: contract-test-only
      GENAI_SERVICE_MONGO_PASSWORD: contract-test-only
      CLINICAL_RECORDS_SERVICE_MONGO_PASSWORD: contract-test-only
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Java 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Provision per-service mongo roles (DATA-02)
        run: |
          docker run --rm -i --network host \
            -e MONGO_ADMIN_URI="$TEST_MONGO_ADMIN_URI" \
            -e AUDIT_SERVICE_MONGO_PASSWORD \
            -e GENAI_SERVICE_MONGO_PASSWORD \
            -e CLINICAL_RECORDS_SERVICE_MONGO_PASSWORD \
            mongo:8.0 bash -s < deploy/scripts/provision-db-roles.sh

      - name: Compile and test
        run: ./mvnw --batch-mode --no-transfer-progress verify -Pprod

  deployment-contract:
    name: Validate deployment contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Validate Compose model
        run: docker compose --env-file deploy/.env.example --file deploy/compose.yml config --quiet

      - name: Validate RKE2 Helm chart
        run: |
          helm lint deploy/chart --values deploy/chart/values-dev.yaml
          helm template dentistdss deploy/chart \
            --namespace dev-dentistdss \
            --values deploy/chart/values-dev.yaml \
            >/tmp/dentistdss-dev.yaml
          helm lint deploy/chart --values deploy/chart/values-prod.yaml
          helm template dentistdss deploy/chart \
            --namespace prod-dentistdss \
            --values deploy/chart/values-prod.yaml \
            >/tmp/dentistdss-prod.yaml
          test "$(grep -c '^kind: Deployment$' /tmp/dentistdss-dev.yaml)" -eq 12
          test "$(grep -c '^kind: Deployment$' /tmp/dentistdss-prod.yaml)" -eq 12
          for manifest in /tmp/dentistdss-dev.yaml /tmp/dentistdss-prod.yaml; do
            awk '
              function validate_document() {
                if (is_deployment && is_config_server && has_config_import) {
                  print "config-server must not set SPRING_CONFIG_IMPORT" > "/dev/stderr"
                  exit 1
                }
              }
              /^---$/ {
                validate_document()
                is_deployment = 0
                is_config_server = 0
                has_config_import = 0
                next
              }
              $0 == "kind: Deployment" { is_deployment = 1 }
              $0 == "  name: config-server" { is_config_server = 1 }
              $0 ~ /- name: SPRING_CONFIG_IMPORT$/ { has_config_import = 1 }
              END { validate_document() }
            ' "$manifest"
          done

      - name: Verify manifest security policy
        run: bash deploy/scripts/verify-manifest-policy.sh /tmp/dentistdss-dev.yaml /tmp/dentistdss-prod.yaml

      - name: Validate deployment scripts
        run: bash -n deploy/scripts/*.sh

      - name: Reject executable database design documents
        run: |
          if head -n 1 docker-entrypoint-initdb.d/01-init.sql | grep -q '^Enum '; then
            echo "::notice::Legacy 01-init.sql is DBML and is intentionally excluded from deploy/compose.yml"
          fi
