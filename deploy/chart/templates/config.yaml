apiVersion: v1
kind: ConfigMap
metadata:
  name: dentistdss-config
  labels:
    {{- include "dentistdss.labels" . | nindent 4 }}
data:
  application.yml: |
{{ .Files.Get "files/application.yml" | indent 4 }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.externalSecrets.storeName }}
  labels:
    {{- include "dentistdss.labels" . | nindent 4 }}
spec:
  provider:
    vault:
      server: {{ required "externalSecrets.vaultServer is required" .Values.externalSecrets.vaultServer | quote }}
      path: kv
      version: v2
      caProvider:
        type: ConfigMap
        name: vault-ca
        namespace: external-secrets
        key: ca.crt
      auth:
        tokenSecretRef:
          name: {{ .Values.externalSecrets.tokenSecretName }}
          key: token
{{- $storeName := .Values.externalSecrets.storeName }}
{{- $runtimePath := .Values.externalSecrets.runtimePath }}
{{- range $secretName, $keys := .Values.externalSecrets.records }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "dentistdss.labels" $ | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: {{ $storeName }}
  target:
    name: {{ $secretName }}
    creationPolicy: Owner
  data:
    {{- range $keys }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $runtimePath | quote }}
        property: {{ . }}
    {{- end }}
{{- end }}
{{- $serviceAuthPath := .Values.externalSecrets.serviceAuthPath }}
{{- range $issuer := list "auth" "appointment" "clinical-records" "notification" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dentistdss-service-auth-{{ $issuer }}
  labels:
    {{- include "dentistdss.labels" $ | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: {{ $storeName }}
  target:
    name: dentistdss-service-auth-{{ $issuer }}
    creationPolicy: Owner
  data:
    - secretKey: SERVICE_AUTH_PRIVATE_KEY
      remoteRef:
        key: {{ printf "%s/%s" $serviceAuthPath $issuer | quote }}
        property: SERVICE_AUTH_PRIVATE_KEY
    - secretKey: SERVICE_AUTH_PUBLIC_KEY
      remoteRef:
        key: {{ printf "%s/%s" $serviceAuthPath $issuer | quote }}
        property: SERVICE_AUTH_PUBLIC_KEY
    - secretKey: SERVICE_AUTH_KEY_ID
      remoteRef:
        key: {{ printf "%s/%s" $serviceAuthPath $issuer | quote }}
        property: SERVICE_AUTH_KEY_ID
{{- end }}
{{- /*
DATA-02: one Vault record per service under dbCredentialsPath holding that
service's database credentials. JDBC services get DB_USERNAME/DB_PASSWORD
(the app datasource uses the per-service least-privilege role; the shared
dentistdss-postgres secret stays mounted for the Flyway migration owner).
Mongo services get their full per-service URI from the same per-service
record (clinical-records holds both its PG pair and its MONGODB_URI).
Rendered unconditionally, like the service-auth secrets: until the records
are seeded the ExternalSecrets sit in a sync-error state and the consuming
pods fail fast on the missing env — fail-closed, per the rollout runbook.
*/}}
{{- $dbCredentialsPath := .Values.externalSecrets.dbCredentialsPath }}
{{- range $svc := list "auth" "clinic" "user-profile" "appointment" "clinical-records" "notification" "system" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dentistdss-db-{{ $svc }}
  labels:
    {{- include "dentistdss.labels" $ | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: {{ $storeName }}
  target:
    name: dentistdss-db-{{ $svc }}
    creationPolicy: Owner
  data:
    - secretKey: DB_USERNAME
      remoteRef:
        key: {{ printf "%s/%s" $dbCredentialsPath $svc | quote }}
        property: DB_USERNAME
    - secretKey: DB_PASSWORD
      remoteRef:
        key: {{ printf "%s/%s" $dbCredentialsPath $svc | quote }}
        property: DB_PASSWORD
{{- end }}
{{- range $item := list (dict "svc" "audit" "key" "SPRING_DATA_MONGODB_URI") (dict "svc" "genai" "key" "SPRING_DATA_MONGODB_URI") (dict "svc" "clinical-records" "key" "MONGODB_URI") }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dentistdss-mongo-{{ $item.svc }}
  labels:
    {{- include "dentistdss.labels" $ | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: {{ $storeName }}
  target:
    name: dentistdss-mongo-{{ $item.svc }}
    creationPolicy: Owner
  data:
    - secretKey: {{ $item.key }}
      remoteRef:
        key: {{ printf "%s/%s" $dbCredentialsPath $item.svc | quote }}
        property: {{ $item.key }}
{{- end }}
{{ if index .Values.services "genai-service" "enabled" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dentistdss-genai-service-auth
  labels:
    {{- include "dentistdss.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: {{ .Values.externalSecrets.genaiStoreKind | default "ClusterSecretStore" }}
    name: {{ .Values.externalSecrets.genaiStoreName | default "homelab-vault" }}
  target:
    name: dentistdss-genai-service-auth
    creationPolicy: Owner
  data:
    - secretKey: GENAI_SERVICE_AUTH_PRIVATE_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.genaiServiceAuthPath | quote }}
        property: GENAI_SERVICE_AUTH_PRIVATE_KEY
    - secretKey: GENAI_SERVICE_AUTH_PUBLIC_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.genaiServiceAuthPath | quote }}
        property: GENAI_SERVICE_AUTH_PUBLIC_KEY
    - secretKey: GENAI_SERVICE_AUTH_KEY_ID
      remoteRef:
        key: {{ .Values.externalSecrets.genaiServiceAuthPath | quote }}
        property: GENAI_SERVICE_AUTH_KEY_ID
{{ end }}
