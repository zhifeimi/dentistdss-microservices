# DATA-02 follow-up: standalone schema migrator. This pre-install/
# pre-upgrade hook Job applies the Flyway migrations bundled in
# db-migrations as the migration owner, BEFORE any application pod rolls.
# It is the only workload besides the postgres StatefulSet and the
# operator's backup that ever sees the owner credential: application
# services boot with spring.flyway.enabled=false and their least-privilege
# runtime roles, so the owner password no longer lives in app pods.
#
# The Job reuses the auth-service image (every JDBC service bundles
# db-migrations on its classpath) and runs the plain-JDBC Migrator main
# through Boot's PropertiesLauncher — the image's fat jar stays untouched.
# A migration failure exits non-zero, failing the hook and the rollout:
# fail closed, never boot services against an unmigrated schema.
apiVersion: batch/v1
kind: Job
metadata:
  name: dentistdss-db-migrator
  labels:
    {{- include "dentistdss.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-migrator
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: dentistdss
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: db-migrator
          image: "{{ .Values.global.imageRegistry }}/dentistdss-auth-service:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - java
            - -cp
            - /app/app.jar
            - -Dloader.main=press.mizhifei.dentist.db.Migrator
            - org.springframework.boot.loader.launch.PropertiesLauncher
          env:
            - name: DB_MIGRATION_URL
              value: jdbc:postgresql://postgres:5432/dentistdss
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dentistdss-postgres
                  key: POSTGRES_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.javaResources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
