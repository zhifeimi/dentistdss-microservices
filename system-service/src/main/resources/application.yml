server:
  port: 8086

spring:
  application:
    name: system-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      timeout: 2s
  config:
    import: optional:configserver:http://localhost:8888

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dentistdss}?sslmode=${DB_SSLMODE:prefer}
    username: ${DB_USERNAME:dentistdss}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  # Schema migrations: Flyway applies the baseline bundled in the db-migrations
  # module (classpath:db/migration). Databases without flyway_schema_history
  # are baselined at version 1 (V1 is skipped, schema untouched); fresh
  # databases get V1 applied before Hibernate validates the schema.
  flyway:
    baseline-on-migrate: true
    baseline-version: '1'
    fail-on-missing-locations: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_SERVICE_URL:http://localhost:8081}/auth/oauth2/jwks

jwt:
  issuer: ${JWT_ISSUER:http://localhost:8080}
  audience: ${JWT_AUDIENCE:dentistdss-api}

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    preferIpAddress: false

# Management/Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  jmx:
    exposure:
      exclude: "*"  # Disable JMX to avoid RMI issues

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    press.mizhifei.dentist: DEBUG

---
# Test database on the same dev server: run with --spring.profiles.active=test
# and POSTGRES_PASSWORD set to the dentistdss_test password.
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/dentistdss_test?sslmode=${DB_SSLMODE:prefer}
    username: ${DB_USERNAME:dentistdss_test}
  data:
    redis:
      username: ${REDIS_USERNAME:dentistdss_test}
      database: ${REDIS_DATABASE:1}
